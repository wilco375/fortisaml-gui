[package]
name = "archway-vpn"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
async-io = "2.6.0"
eframe = { version = "0.36.2", default-features = false, features = ["accesskit", "default_fonts", "glow", "links", "wayland", "x11"] }
egui-phosphor = "0.14"
env_logger = "0.11.11"
futures-util = "0.3.34"
getrandom = "0.4"
ipnet = "2.12"
libc = "0.2.190"
netlink-packet-route = "0.33"
netlink-sys = "0.9"
opener = { version = "0.9.0", features = ["reveal"] }
rtnetlink = { version = "0.23", default-features = false, features = ["smol_socket"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.8.4"
secret-service = { version = "5.2", features = ["rt-async-io-crypto-rust"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_vici = "0.1"
toml = { version = "1.1", features = ["preserve_order"] }
vec1 = { version = "1.12", features = ["serde"] }
x509-parser = "0.18.1"
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
zeroize = "1.9"
