[package]
name = "fortisaml-gui"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
aes = "0.9.3"
cbc = "0.2.1"
des = "0.9.0"
eframe = { version = "0.36.2", default-features = false, features = ["accesskit", "default_fonts", "glow", "links", "wayland", "x11"] }
env_logger = "0.11.11"
getrandom = "0.4.3"
hmac = "0.13.0"
libc = "0.2.190"
md-5 = "0.11.0"
md4 = "0.11.0"
num-bigint = "0.5.1"
p256 = { version = "0.14.0", features = ["ecdh"] }
p384 = { version = "0.14.0", features = ["ecdh"] }
p521 = { version = "0.14.0", features = ["ecdh"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.8.4"
secret-service = { version = "5.2", features = ["rt-async-io-crypto-rust"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.0"
x509-parser = "0.18.1"
