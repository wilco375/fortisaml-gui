name: release

on:
  push:
    tags: ["v[0-9]*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # keep in step with the rust image of the packages job
  RUST_VERSION: "1.96.0"

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # first, so a bad tag fails in seconds and not after the long build
      - name: Tag matches the Cargo.toml version
        run: |
          want=v$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          if [ "$GITHUB_REF_NAME" != "$want" ]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml (expected $want)" >&2
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: cargo clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --locked

  packages:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Debian 12 (glibc 2.36), so the binary runs on every distro at least that new: Debian 12/13, Ubuntu 24.04/26.04,
    # Fedora, Arch. Not the ubuntu-24.04 runner: a binary needs at least the glibc it was built against, and 24.04's
    # 2.39 would leave Debian 12 out (newer runners drop Ubuntu 24.04 and Debian 13 too). No -dev packages needed: the
    # GUI libs are dlopen()ed at run time.
    # Tag plus digest of the multi-arch index; keep the Rust version in step with RUST_VERSION above.
    container: docker.io/library/rust:1.96.0-bookworm@sha256:5e2214abe154fe26e39f64488952e5c991eeed1d6d6da7cc8381ae83927f0cfc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-deb@3.8.0,cargo-generate-rpm@0.21.0
      - name: cargo build
        run: cargo build --release --locked
      # contents and dependencies: [package.metadata.deb] and [package.metadata.generate-rpm] in Cargo.toml
      - name: cargo deb
        run: cargo deb --no-build -o dist/
      - name: cargo generate-rpm
        run: cargo generate-rpm -o dist/
      - name: Checksums
        run: cd dist && sha256sum -- * > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: dist/*
          if-no-files-found: error

  release:
    needs: packages
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: dist
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
